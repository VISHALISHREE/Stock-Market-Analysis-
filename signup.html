<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Assistant — Sign Up</title>
  <link rel="stylesheet" href="signup.css" />
</head>
<body>

<header class="topbar">
  <div class="logo">Trading<span>Assistant</span></div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="howitworks.html">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="signup-container">
  <div class="signup-box">
    <h2>Create Your Account</h2>
    <p class="hint">Sign up to start using your personalized dashboard</p>

    <form action="#" method="POST">
      <!-- Basic details -->
      <input type="text" name="fullname" placeholder="Full Name" class="input" autocomplete="name" required />
      <input type="number" name="age" placeholder="Age" class="input" min="12" required />

      <select name="gender" class="input" required>
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <div class="phone-row">
        <input type="text" name="countrycode" placeholder="+Country Code (e.g. +91)" class="input" required />
        <input type="tel" name="phonenumber" placeholder="Phone Number" class="input" required />
      </div>

      <input type="text" name="country" placeholder="Country" class="input" required />
      <input type="text" name="state" placeholder="State" class="input" required />
      <input type="text" name="city" placeholder="City" class="input" required />
      <input type="text" name="postalcode" placeholder="Postal Code" class="input" pattern="[0-9]{4,10}" required />
      <input type="email" name="email" placeholder="Email" class="input" autocomplete="email" required />
      <input
        type="password"
        name="password"
        placeholder="Create Password (1 capital & 1 number)"
        class="input"
        pattern="^(?=.*[A-Z])(?=.*[0-9]).{6,}$"
        title="Must contain at least one capital letter and one number"
        autocomplete="new-password"
        required
      />

      <button type="submit" class="btn primary">Sign Up</button>
    </form>

    <button class="btn google">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="G" width="18" />
      Sign up with Google
    </button>

    <p class="switch">Already have an account? <a href="login.html">Login</a></p>
  </div>
</main>

</body>
</html>
